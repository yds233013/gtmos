name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gtmos
          POSTGRES_PASSWORD: gtmos
          POSTGRES_DB: gtmos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gtmos" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://gtmos:gtmos@localhost:5432/gtmos_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql+psycopg://gtmos:gtmos@localhost:5432/gtmos_test
        run: |
          uv run python -c "from sqlalchemy import create_engine, text; e=create_engine('$DATABASE_URL'); c=e.connect(); c.execute(text('drop schema public cascade; create schema public')); c.commit()"
          uv run alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
