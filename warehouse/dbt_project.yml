name: gtmos_warehouse
version: "1.0.0"
config-version: 2

profile: gtmos

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

flags:
  # No telemetry: this project builds in environments with no outbound network access.
  send_anonymous_usage_stats: false
  require_model_names_without_spaces: true
  source_freshness_run_project_hooks: true

vars:
  # Lookback used by the association analysis in dim_signal_effect. Mirrors the default
  # `days` argument of analytics.signal_correlation() in the API.
  signal_analysis_days: 180
  # Extra head start given to signals: a signal that fired shortly before the first touch is the
  # interesting case, so the signal window opens 90 days before the analysis window.
  signal_lookback_extra_days: 90
  # How far back an incremental run re-reads, so activities that land late are still picked up.
  activity_late_arrival_days: 3

models:
  gtmos_warehouse:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
