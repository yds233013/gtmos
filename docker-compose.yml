# GTMOS local stack. `make up` starts everything; `make dev-deps` starts only Postgres + Redis.
name: gtmos

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gtmos
      POSTGRES_PASSWORD: gtmos
      POSTGRES_DB: gtmos
    ports:
      - "${GTMOS_DB_PORT:-56432}:5432"   # uncommon host port avoids clashing with other local databases
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtmos -d gtmos"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${GTMOS_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://gtmos:gtmos@db:5432/gtmos
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      CORS_ORIGINS: '["http://localhost:3010","http://127.0.0.1:3010"]'
    command: ["sh", "-c", "alembic upgrade head && python -m gtmos.seed --if-empty && uvicorn gtmos.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${GTMOS_API_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  worker:
    build:
      context: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://gtmos:gtmos@db:5432/gtmos
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
    command: ["python", "-m", "gtmos.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; redis.Redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${GTMOS_WEB_PORT:-3010}:3000"
    depends_on:
      api:
        condition: service_healthy

  # Optional: local n8n for importing the templates in integrations/n8n. `make n8n`.
  n8n:
    # Pinned, not :latest. An orchestration layer that silently changes version under you is the thing
    # this project is supposed to know better than.
    image: n8nio/n8n:2.40.5
    profiles: ["n8n"]
    ports:
      - "5678:5678"
    environment:
      # Defaults to the host-run API (`make dev`), because that is how this is developed. Override to
      # http://api:8000 when the whole stack runs in compose.
      GTMOS_BASE_URL: ${N8N_GTMOS_BASE_URL:-http://host.docker.internal:8010}
      GTMOS_WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      GTMOS_ADMIN_TOKEN: ${ADMIN_API_TOKEN:-}
      HUBSPOT_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # templates read $env (n8n 2.x blocks it by default)
      NODE_FUNCTION_ALLOW_BUILTIN: crypto     # template 01 signs requests with HMAC
      # Deterministic webhook URLs for the docs and the golden flow. N8N_WEBHOOK_URL, not WEBHOOK_URL:
      # the unprefixed form is deprecated from 2.35.0.
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"        # no telemetry from a portfolio demo
      N8N_SECURE_COOKIE: "false"              # served over plain http on localhost
      # N8N_RUNNERS_ENABLED is deliberately absent: it is deprecated from n8n 2.0 and setting it now
      # produces a warning rather than doing anything.
    extra_hosts:
      # Docker Desktop provides this automatically; Linux does not.
      - "host.docker.internal:host-gateway"
    volumes:
      - n8ndata:/home/node/.n8n
      # Workflow definitions are version-controlled and mounted read-only so `n8n import:workflow`
      # inside the container reads exactly what is in git.
      - ./integrations/n8n:/workflows:ro

volumes:
  pgdata:
  n8ndata:
